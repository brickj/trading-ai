version: '3.8'

services:
  news-service:
    build: ./news-service
    ports:
      - "8081:8081"
    environment:
      - NEWS_SERVICE_PORT=8081
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    
  signal-service:
    build: ./signal-service
    ports:
      - "8082:8082"
    environment:
      - SIGNAL_SERVICE_PORT=8082
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    
  risk-service:
    build: ./risk-service
    ports:
      - "8083:8083"
    environment:
      - RISK_SERVICE_PORT=8083
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    
  data-service:
    build: ./data-service
    ports:
      - "8084:8084"
    environment:
      - DATA_SERVICE_PORT=8084
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  default:
    name: trading-services
    driver: bridge 