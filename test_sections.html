<!DOCTYPE html>
<html>
<head>
    <title>Section Display Test</title>
</head>
<body>
    <h1>Section Display Test</h1>
    
    <div id="resultsSection" style="display: none; border: 2px solid red; padding: 10px;">
        <h2>Results Section</h2>
        <p>This should be visible when displayed</p>
    </div>
    
    <div id="backtestResults" style="display: none; border: 2px solid green; padding: 10px;">
        <h2>Backtest Results Section</h2>
        <p>This should be visible when displayed</p>
    </div>
    
    <button onclick="showSections()">Show Sections</button>
    <button onclick="hideSections()">Hide Sections</button>
    
    <script>
        function showSections() {
            console.log('Showing sections...');
            document.getElementById('resultsSection').style.display = 'block';
            document.getElementById('backtestResults').style.display = 'block';
            console.log('Sections should now be visible');
        }
        
        function hideSections() {
            console.log('Hiding sections...');
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('backtestResults').style.display = 'none';
            console.log('Sections should now be hidden');
        }
    </script>
</body>
</html>
