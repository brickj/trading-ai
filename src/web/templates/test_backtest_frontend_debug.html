<!DOCTYPE html>
<html>
<head>
    <title>Backtest Frontend Debug</title>
</head>
<body>
    <h1>Backtest Frontend Debug</h1>
    <div id="debug"></div>
    
    <script>
        async function testBacktestAPI() {
            const debug = document.getElementById('debug');
            debug.innerHTML = '<p>Testing API...</p>';
            
            try {
                const response = await fetch('/api/backtest', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        symbol: 'AAPL',
                        days_back: 730
                    })
                });
                
                const result = await response.json();
                debug.innerHTML += '<p>API Response received</p>';
                debug.innerHTML += '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
                
                if (result.data) {
                    debug.innerHTML += '<p>Data structure:</p>';
                    debug.innerHTML += '<ul>';
                    debug.innerHTML += '<li>initial_capital: ' + result.data.initial_capital + '</li>';
                    debug.innerHTML += '<li>final_capital: ' + result.data.final_capital + '</li>';
                    debug.innerHTML += '<li>total_return: ' + result.data.total_return + '</li>';
                    debug.innerHTML += '<li>win_rate: ' + result.data.win_rate + '</li>';
                    debug.innerHTML += '<li>total_trades: ' + result.data.total_trades + '</li>';
                    debug.innerHTML += '<li>trades array length: ' + (result.data.trades ? result.data.trades.length : 'undefined') + '</li>';
                    debug.innerHTML += '</ul>';
                }
                
            } catch (error) {
                debug.innerHTML += '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
        
        // Run test when page loads
        testBacktestAPI();
    </script>
</body>
</html>
