<!DOCTYPE html>
<html>
<head>
    <title>Debug Panel Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { padding: 20px; }
        pre { max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Debug Panel Test</h1>
        <div class="row mb-3">
            <div class="col">
                <button id="testButton" class="btn btn-primary">Test Debug Panel</button>
            </div>
        </div>
        
        <!-- Debug Panel -->
        <div class="card mt-4">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5><i class="fas fa-bug"></i> Debug Panel</h5>
                </div>
            </div>
            <div class="card-body" id="debugPanelBody" style="display: block;">
                <div class="row">
                    <div class="col-md-6">
                        <h6>Request</h6>
                        <div id="requestStatus" class="alert alert-secondary">
                            <small>No request made yet</small>
                        </div>
                        <pre id="requestData" class="bg-light p-2 border rounded">No request data</pre>
                    </div>
                    <div class="col-md-6">
                        <h6>Response</h6>
                        <div id="responseStatus" class="alert alert-secondary">
                            <small>No response received yet</small>
                        </div>
                        <pre id="responseData" class="bg-light p-2 border rounded">No response data</pre>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Debug panel update function
        function updateDebugPanel(type, data) {
            console.log('Updating debug panel:', type, data);
            
            switch(type) {
                case 'request':
                    document.getElementById('requestStatus').innerHTML = `
                        <strong>Request in progress</strong><br>
                        <small>
                            Method: ${data.method}<br>
                            URL: ${data.url}<br>
                            Symbol: ${data.symbol}<br>
                            Timestamp: ${new Date(data.timestamp).toLocaleString()}
                        </small>
                    `;
                    
                    document.getElementById('requestData').textContent = JSON.stringify(data, null, 2);
                    
                    // Reset response section when new request starts
                    document.getElementById('responseStatus').innerHTML = '<small>Waiting for response...</small>';
                    document.getElementById('responseData').textContent = 'Waiting for response...';
                    break;
                    
                case 'response':
                    const statusClass = data.status >= 200 && data.status < 300 ? 'text-success' : 'text-danger';
                    document.getElementById('responseStatus').innerHTML = `
                        <strong class="${statusClass}">Response received</strong><br>
                        <small>
                            Status: ${data.status} ${data.statusText}<br>
                            Timestamp: ${new Date(data.timestamp).toLocaleString()}<br>
                            ${data.error ? `Error: ${data.error}` : ''}
                        </small>
                    `;
                    break;
                    
                case 'responseData':
                    document.getElementById('responseData').textContent = JSON.stringify(data, null, 2);
                    break;
            }
        }
        
        // Test button
        document.getElementById('testButton').addEventListener('click', function() {
            // Simulate request
            const requestData = {
                method: 'POST',
                url: '/api/analyze_stock',
                symbol: 'AAPL',
                ai_provider: 'ollama',
                timestamp: new Date().toISOString()
            };
            
            updateDebugPanel('request', requestData);
            
            // Simulate response after 1 second
            setTimeout(() => {
                const responseStatus = {
                    status: 200,
                    statusText: 'OK',
                    timestamp: new Date().toISOString()
                };
                
                updateDebugPanel('response', responseStatus);
                
                // Simulate response data
                const responseData = {
                    status: 'success',
                    data: {
                        symbol: 'AAPL',
                        price_data: {
                            current_price: 196.58,
                            change: 0.08,
                            change_percent: '0.04%'
                        },
                        sentiment_analysis: {
                            sentiment_score: -0.1,
                            confidence: 0.6
                        },
                        trading_recommendation: {
                            action: 'HOLD',
                            reasoning: 'Neutral sentiment'
                        }
                    }
                };
                
                updateDebugPanel('responseData', responseData);
            }, 1000);
        });
    </script>
</body>
</html>
