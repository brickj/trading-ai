<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Analysis Display Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { padding: 20px; }
        .card { margin-bottom: 20px; }
        .badge { font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enhanced Analysis Display Test</h1>
        <div id="testResults"></div>
    </div>

    <script>
        // Test data that matches the expected format from the backend
        const testData = {
            data: {
                enhanced_analysis: {
                    symbol: 'AAPL',
                    price_data: {
                        current_price: 175.34,
                        change: 2.45,
                        change_percent: '1.42%',
                        volume: 75000000
                    },
                    recommendations: [
                        {
                            strategy_type: 'Momentum Breakout',
                            action: 'BUY',
                            confidence: 0.75,
                            reasoning: 'Strong upward momentum with increasing volume',
                            option_type: 'call',
                            strike_price: 180,
                            option_price: 3.45
                        },
                        {
                            strategy_type: 'Mean Reversion',
                            action: 'HOLD',
                            confidence: 0.6,
                            reasoning: 'Price is near the middle of the recent range',
                            option_type: 'put',
                            strike_price: 170,
                            option_price: 2.10
                        }
                    ],
                    backtest_results: {
                        'Momentum Breakout': {
                            win_rate: 68.2,
                            avg_return: 5.3,
                            max_gain: 25.4,
                            max_loss: 12.1,
                            total_trades: 45
                        },
                        'Mean Reversion': {
                            win_rate: 72.5,
                            avg_return: 3.8,
                            max_gain: 18.7,
                            max_loss: 8.9,
                            total_trades: 62
                        },
                        overall: {
                            total_return: 42.5,
                            win_rate: 70.3,
                            total_trades: 107,
                            avg_hold_time: '3.2 days'
                        }
                    }
                }
            }
        };

        // Function to get color based on action
        function getSignalColor(action) {
            switch(action) {
                case 'BUY': return 'success';
                case 'SELL': return 'danger';
                case 'HOLD': return 'warning';
                default: return 'secondary';
            }
        }

        // Function to generate the enhanced results HTML (copied from dashboard.js)
        function generateEnhancedResultsHTML(data) {
            // Extract data from the nested structure
            const analysisData = data.data?.enhanced_analysis || data.data?.comprehensive_analysis || data.enhanced_analysis || data.comprehensive_analysis || {};
            const symbol = analysisData.symbol || 'N/A';
            const priceData = analysisData.price_data || {};
            const recommendations = analysisData.recommendations || [];
            const backtestResults = analysisData.backtest_results || {};
            
            // Generate HTML for each recommendation
            const recommendationsHTML = recommendations.map((rec, index) => {
                const stats = backtestResults[rec.strategy_type] || {};
                const winRate = stats.win_rate || 0;
                const avgReturn = stats.avg_return || 0;
                const maxGain = stats.max_gain || 0;
                const maxLoss = stats.max_loss || 0;
                const totalTrades = stats.total_trades || 0;
                
                return `
                    <div class="col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-header bg-${getSignalColor(rec.action)} text-white">
                                <h6 class="mb-0">${rec.strategy_type || 'Strategy ' + (index + 1)}</h6>
                            </div>
                            <div class="card-body">
                                <div class="d-flex justify-content-between mb-2">
                                    <span><strong>Action:</strong> <span class="badge bg-${getSignalColor(rec.action)}">${rec.action || 'N/A'}</span></span>
                                    <span><strong>Confidence:</strong> ${Math.round((rec.confidence || 0) * 100)}%</span>
                                </div>
                                
                                ${rec.option_type ? `
                                <div class="mb-2">
                                    <strong>${rec.option_type.toUpperCase()} Option</strong><br>
                                    <small>Strike: $${rec.strike_price || 'N/A'} | Premium: $${rec.option_price || 'N/A'}</small>
                                </div>
                                ` : ''}
                                
                                <div class="mb-2">
                                    <strong>Backtest Results</strong>
                                    <div class="small">
                                        <div>Win Rate: ${winRate}% (${totalTrades} trades)</div>
                                        <div>Avg Return: ${avgReturn > 0 ? '+' : ''}${avgReturn}%</div>
                                        <div>Max Gain: ${maxGain}% | Max Loss: ${maxLoss}%</div>
                                    </div>
                                </div>
                                
                                ${rec.reasoning ? `
                                <div class="alert alert-light p-2 mt-2 mb-0 small">
                                    <strong>Strategy:</strong> ${rec.reasoning}
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('\n');
            
            // Generate performance summary
            const performanceSummary = backtestResults.overall ? `
                <div class="col-12 mb-4">
                    <div class="card">
                        <div class="card-header bg-primary text-white">
                            <h6 class="mb-0">Overall Performance Summary</h6>
                        </div>
                        <div class="card-body">
                            <div class="row text-center">
                                <div class="col-6 col-md-3">
                                    <div class="display-6 ${backtestResults.overall.total_return >= 0 ? 'text-success' : 'text-danger'}">
                                        ${backtestResults.overall.total_return > 0 ? '+' : ''}${backtestResults.overall.total_return || 0}%
                                    </div>
                                    <div class="text-muted small">Total Return</div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="display-6">${backtestResults.overall.win_rate || 0}%</div>
                                    <div class="text-muted small">Win Rate</div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="display-6">${backtestResults.overall.total_trades || 0}</div>
                                    <div class="text-muted small">Total Trades</div>
                                </div>
                                <div class="col-6 col-md-3">
                                    <div class="display-6">${backtestResults.overall.avg_hold_time || 'N/A'}</div>
                                    <div class="text-muted small">Avg Hold Time</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            ` : '';
            
            return `
                <div class="col-12">
                    <div class="card mb-4">
                        <div class="card-header bg-success text-white">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="mb-0"><i class="fas fa-chart-line"></i> ${symbol} - Enhanced Analysis</h5>
                                <span class="badge bg-light text-dark">${recommendations.length} Strategies</span>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <div class="h5 mb-1">$${priceData.current_price || 'N/A'}</div>
                                    <div class="text-muted small">Current Price</div>
                                </div>
                                <div class="col-md-4">
                                    <div class="h5 mb-1">${priceData.change || 'N/A'} (${priceData.change_percent || 'N/A'})</div>
                                    <div class="text-muted small">Today's Change</div>
                                </div>
                                <div class="col-md-4">
                                    <div class="h5 mb-1">${priceData.volume ? priceData.volume.toLocaleString() : 'N/A'}</div>
                                    <div class="text-muted small">Volume</div>
                                </div>
                            </div>
                            
                            ${performanceSummary}
                            
                            <div class="row">
                                ${recommendationsHTML || '<div class="col-12">No strategy recommendations available</div>'}
                            </div>
                            
                            <div class="mt-3 small text-muted">
                                <i class="fas fa-info-circle"></i> Analysis generated on ${new Date().toLocaleString()}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Run the test
        document.addEventListener('DOMContentLoaded', () => {
            const resultsDiv = document.getElementById('testResults');
            
            try {
                // Generate the HTML using our function
                const html = generateEnhancedResultsHTML(testData);
                
                // Display the results
                resultsDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h4>Test Passed! 🎉</h4>
                        <p>The enhanced analysis display is working correctly with the test data.</p>
                    </div>
                    <h3>Rendered Output:</h3>
                    <div class="row">
                        ${html}
                    </div>
                    <h3 class="mt-4">Test Data:</h3>
                    <pre class="bg-light p-3">${JSON.stringify(testData, null, 2)}</pre>
                `;
                
                console.log('Test passed!', { testData, html });
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h4>Test Failed! ❌</h4>
                        <p>An error occurred while testing the enhanced analysis display:</p>
                        <pre>${error.stack}</pre>
                    </div>
                `;
                console.error('Test failed:', error);
            }
        });
    </script>
</body>
</html>
